<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your little celebration</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/template.css"><script src="/catalog.js" defer></script><script src="/template.js" defer></script></head>
<body><header><a href="/#templates">little cheers ✳</a><span id="template-title"></span><button id="edit-template">Personalize</button></header>
<main id="celebration"><section class="poster"><p id="occasion"></p><h1><span id="preview-headline"></span><br><span data-person>Alex</span>.</h1><figure><img id="preview-photo" alt="A favorite memory"><figcaption>A little something, just for you.</figcaption></figure><a href="#letter" class="letter-link">There's a note for you ↓</a></section><section class="letter" id="letter"><span aria-hidden="true">♡</span><h2>Dear <span data-person>Alex</span>,</h2><p id="preview-note"></p><p id="preview-sender"></p></section></main>
<dialog id="template-settings" aria-labelledby="settings-heading"><div class="settings-heading"><h2 id="settings-heading">Make it personal.</h2><button id="close-settings" aria-label="Close personalization">×</button></div><form id="template-form"><label>Their name<input id="name" maxlength="35" required></label><label>Headline<input id="headline" maxlength="70" required></label><label>Your note<textarea id="note" rows="5" maxlength="600"></textarea></label><label>From<input id="sender" maxlength="50"></label><label>Your photo<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><fieldset><legend>Color</legend><div id="colors"></div></fieldset><p id="status" role="status">Changes are saved in this browser when you save the draft.</p><button type="submit" class="primary">Save & preview</button><button type="button" id="download-page">Download page</button></form></dialog>
</body></html>
